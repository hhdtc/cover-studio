name: cover-studio

services:
  # Clones the private repository from GitHub and builds the static site.
  # This uses a plain container, so it works without BuildKit/buildx secrets.
  builder:
    image: node:22-alpine
    environment:
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      REPO_URL: ${REPO_URL:-https://github.com/hhdtc/cover-studio.git}
      REPO_REF: ${REPO_REF:-main}
    volumes:
      - app:/out
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        test -n "$$GITHUB_TOKEN" || { echo 'ERROR: GITHUB_TOKEN is required (Contents: read)' >&2; exit 1; }
        apk add --no-cache git >/dev/null
        AUTH=$$(printf 'x-access-token:%s' "$$GITHUB_TOKEN" | base64 | tr -d '\n')
        rm -rf /tmp/repo
        git -c http.extraHeader="Authorization: Basic $$AUTH" \
          clone --depth 1 --branch "$$REPO_REF" "$$REPO_URL" /tmp/repo
        cd /tmp/repo
        npm ci --no-audit --no-fund
        npm run build
        rm -rf /out/*
        cp -a dist/. /out/
    restart: "no"

  # Serves the built files. Starts only after the builder finishes successfully.
  web:
    image: nginx:1.27-alpine
    depends_on:
      builder:
        condition: service_completed_successfully
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - app:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  app:
