# Load the REA MCP server into a DSH profile.
# Start DSH with: dsh web --patch /absolute/path/to/dsh-mcp-rea.patch.yml
- id: mcp-rea
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: rea
    transport: stdio
    command: /home/hhdtc/.local/share/fnm/node-versions/v24.18.1/installation/bin/rea
    args:
      - mcp
    failOnStartupError: true
    toolCallTimeoutMs: 120000
