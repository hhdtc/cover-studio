# Load the REA MCP server into a DSH profile.
#
# Cordis patches append to an existing plugin list, so a bare `- id: ...` entry
# fails with `patch: entry "..." not found`. Wrap the entry in `insert`.
#
# One profile only:  dsh web --patch /absolute/path/to/dsh-mcp-rea.patch.yml
# Every profile:     copy this file to ~/.dsh/cordis.patch.yml
- insert:
    - id: rea-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: rea
        transport: stdio
        # fnm's `default` alias, not a pinned node-versions/ path: survives
        # deleting the Node build rea was installed into.
        command: /home/hhdtc/.local/share/fnm/aliases/default/bin/rea
        args:
          - mcp
        # false = a missing/broken rea leaves DSH running without rea tools
        # instead of aborting startup; the reconnect policy still retries.
        failOnStartupError: false
        toolCallTimeoutMs: 120000
