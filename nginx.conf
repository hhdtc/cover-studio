server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The app uses hash routing, but keep a SPA fallback for direct paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived hashed assets.
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|webp|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # JSON catalog should always be fresh enough for agents.
    location = /ui-catalog.json {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}

# Rhine Music (compose service `rhine`) is served on its own container hostname.
# The app assumes it lives at the root of a host, so a hostname avoids rewriting
# its absolute asset and model URLs; no extra host port is published.
server {
    listen 80;
    server_name rhine.localhost;

    location / {
        proxy_pass http://rhine:8080;
        proxy_http_version 1.1;
        # The app rejects non-loopback Host headers (anti DNS-rebinding), so the
        # public hostname is rewritten here; the container is only reachable on
        # the compose network anyway.
        proxy_set_header Host 127.0.0.1:8080;
        # The app compares Origin against the Host it received, so both are
        # rewritten together; otherwise module-script requests get a JSON 403.
        proxy_set_header Origin http://127.0.0.1:8080;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
