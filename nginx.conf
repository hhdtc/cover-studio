server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The app uses hash routing, but keep a SPA fallback for direct paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived hashed assets.
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|webp|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # JSON catalog should always be fresh enough for agents.
    location = /ui-catalog.json {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
